<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScriptMe Prompt App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url("static/image.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 20px 40px;
    }

    .box {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      margin-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      border-radius: 15px;
      border: none;
      margin-bottom: 20px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      border-radius: 15px;
      border: none;
      background-color: #3498db;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    #response {
      margin-top: 20px;
      padding: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>ScriptMe Prompt ✨</h1>
      <input type="text" id="prompt" placeholder="Ask something like 'What is life?'" />
      <button onclick="sendPrompt()">Submit</button>
      <div id="response"></div>
    </div>
  </div>

  <script>
    async function sendPrompt() {
      const prompt = document.getElementById('prompt').value;
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById('response').innerText = data.response;
    }
  </script>
</body>
</html>
